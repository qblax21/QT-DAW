[package]
name = "qtdaw-engine"
description = "QT DAW audio engine: device I/O, routing and metering"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# ASIO is how pro interfaces (X32, AudioBox, etc.) reach low latency on Windows.
# It needs the Steinberg ASIO SDK and LLVM/clang at build time, so it is opt-in.
asio = ["cpal/asio"]

[dependencies]
anyhow = "1.0.105"
arc-swap = "1.9.5"
cpal = "0.18.2"
dirs = "7.0.0"
hound = "3.5.1"
ringbuf = "0.6.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
