[package]
name = "qtdaw-probe"
description = "QT DAW hardware probe: list audio devices and test live input"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
asio = ["qtdaw-engine/asio"]

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
qtdaw-engine = { path = "../qtdaw-engine" }
