[package]
name = "qtdaw-app"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "QT DAW desktop app"

[[bin]]
name = "qtdaw"
path = "src/main.rs"

[features]
asio = ["qtdaw-engine/asio"]

[dependencies]
anyhow = "1.0.105"
dirs = "7.0.0"
eframe = "0.37.0"
qtdaw-engine = { version = "0.1.0", path = "../qtdaw-engine" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
