[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["third_party"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[patch.crates-io]
# Local copy with a one-line fix so ASIO builds on the windows-gnu toolchain.
# See third_party/asio-sys/build.rs ("QT DAW patch").
asio-sys = { path = "third_party/asio-sys" }

[profile.dev]
# Audio code is too slow to run glitch-free unoptimized; keep debug info but optimize.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
